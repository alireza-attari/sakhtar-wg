# Install as /etc/rsyslog.d/60-sakhtar-wg-forward.conf, check with `rsyslogd -N1`,
# then `systemctl restart rsyslog`.
#
# Forwards only sakhtar-wg's lines (journald hands them to rsyslog with program
# name sakhtar-wg) to a central syslog collector. The default RFC3164 format leaves
# the JSON body as the bare message, which collectors can decode as JSON. There is
# no `stop`, so the local /var/log/syslog copy is kept.
#
# Replace 192.0.2.8:5514 with the collector.
if $programname == 'sakhtar-wg' then {
  action(type="omfwd" target="192.0.2.8" port="5514" protocol="udp")
}
