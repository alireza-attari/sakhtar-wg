name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.5"
  GOVULNCHECK_VERSION: "v1.6.0"

jobs:
  build:
    name: build-and-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify tag and changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          test "$(git describe --tags --exact-match)" = "$GITHUB_REF_NAME"
          grep -F "## [${GITHUB_REF_NAME#v}]" CHANGELOG.md
      - name: Test, race, and static analysis
        run: |
          go mod verify
          go test ./...
          go test -race ./...
          go vet ./...
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go vet ./...
      - name: Privileged disposable namespace gate
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables wireguard-tools
          sudo modprobe wireguard || true
          sudo -E "$(command -v go)" test -tags=integration -count=1 -timeout=2m ./...
      - name: Vulnerability gate
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 "$RUNNER_TEMP/bin/govulncheck" ./...
      - name: Reproducible release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          scripts/build-release.sh dist
          VERIFY_REPRODUCIBLE=1 scripts/verify-release.sh dist
          cp LICENSE README.md config.example.yaml sakhtar-wg.service dist/
      - name: AMD64 SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: dist/sakhtar-wg-linux-amd64
          format: spdx-json
          output-file: dist/sakhtar-wg-linux-amd64.spdx.json
          upload-artifact: false
      - name: ARM64 SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: dist/sakhtar-wg-linux-arm64
          format: spdx-json
          output-file: dist/sakhtar-wg-linux-arm64.spdx.json
          upload-artifact: false
      - name: Final checksums and SBOM presence
        run: |
          test -s dist/sakhtar-wg-linux-amd64.spdx.json
          test -s dist/sakhtar-wg-linux-arm64.spdx.json
          (cd dist && shasum -a 256 \
            sakhtar-wg-linux-amd64 sakhtar-wg-linux-arm64 \
            sakhtar-wg-linux-amd64.spdx.json sakhtar-wg-linux-arm64.spdx.json \
            BUILD-METADATA.txt LICENSE README.md config.example.yaml sakhtar-wg.service \
            > SHA256SUMS)
      - name: Clean-image installation smoke
        run: |
          for IMAGE in debian:13-slim ubuntu:24.04; do
            docker run --rm -v "$PWD/dist:/artifacts:ro" "$IMAGE" sh -eu -c '
              install -m 0755 /artifacts/sakhtar-wg-linux-amd64 /usr/local/bin/sakhtar-wg
              sakhtar-wg version
            '
          done
          sudo install -m 0755 dist/sakhtar-wg-linux-amd64 /usr/local/bin/sakhtar-wg
          systemd-analyze verify sakhtar-wg.service
          docker build --build-arg TARGETARCH=amd64 -t sakhtar-wg:release-smoke .
          set +e
          docker run --rm \
            --network none \
            --cap-drop ALL --cap-add NET_ADMIN \
            --security-opt no-new-privileges \
            --read-only \
            --tmpfs /run/sakhtar-wg:rw,noexec,nosuid,nodev,mode=0700 \
            --tmpfs /var/lib/sakhtar-wg:rw,noexec,nosuid,nodev,mode=0700 \
            -v "$PWD/testdata/release-smoke.yaml:/etc/sakhtar-wg/config.yaml:ro" \
            --entrypoint timeout \
            sakhtar-wg:release-smoke \
            --signal=TERM 5 /usr/local/bin/sakhtar-wg up -c /etc/sakhtar-wg/config.yaml
          STATUS=$?
          set -e
          test "$STATUS" -eq 124
      - name: Upload immutable release inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sakhtar-wg-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish-release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download verified release inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sakhtar-wg-${{ github.ref_name }}
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Keyless-sign checksum manifest
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Verify checksum signature
        run: >-
          cosign verify-blob
          --bundle dist/SHA256SUMS.sigstore.json
          --certificate-identity-regexp="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@.*"
          --certificate-oidc-issuer=https://token.actions.githubusercontent.com
          dist/SHA256SUMS
      - name: Attest binary and SBOM provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/sakhtar-wg-linux-amd64
            dist/sakhtar-wg-linux-arm64
            dist/sakhtar-wg-linux-amd64.spdx.json
            dist/sakhtar-wg-linux-arm64.spdx.json
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate immutable and convenience image tags
        id: image_tags
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR="${VERSION%%.*}"
          REMAINDER="${VERSION#*.}"
          MINOR="${REMAINDER%%.*}"
          {
            echo "value<<EOF"
            echo "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}"
            echo "ghcr.io/${GITHUB_REPOSITORY}:${VERSION}"
            echo "ghcr.io/${GITHUB_REPOSITORY}:${MAJOR}.${MINOR}"
            echo "ghcr.io/${GITHUB_REPOSITORY}:${MAJOR}"
            echo "ghcr.io/${GITHUB_REPOSITORY}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and publish multi-architecture container
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image_tags.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=sakhtar-wg
            org.opencontainers.image.description=WireGuard policy-routing daemon for Linux
          provenance: mode=max
          sbom: true
      - name: Sign container by digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"
      - name: Attest container provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Released container vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Verify GitHub attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify dist/sakhtar-wg-linux-amd64 --repo "$GITHUB_REPOSITORY"
          gh attestation verify dist/sakhtar-wg-linux-arm64 --repo "$GITHUB_REPOSITORY"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "sakhtar-wg ${GITHUB_REF_NAME}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
